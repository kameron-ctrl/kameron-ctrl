name: Generate Koi Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Koi
        uses: yalongwastaken/git-profile-koi@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
